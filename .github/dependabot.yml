version: 2
updates:
  # 1) Root workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "dependabot"
      - "deps:root"
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: "increase"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      root-dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
      root-runtime-deps:
        dependency-type: "production"
        patterns:
          - "*"

  # 2) second-brain frontend
  - package-ecosystem: "npm"
    directory: "/apps/second-brain/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:10"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "dependabot"
      - "deps:frontend"
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: "increase"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-react:
        patterns:
          - "react"
          - "react-dom"
          - "react-markdown"
          - "@types/react*"
      frontend-build:
        dependency-type: "development"
        patterns:
          - "vite"
          - "@vitejs/*"
          - "rollup"
          - "@rollup/*"
      frontend-runtime:
        dependency-type: "production"
        patterns:
          - "*"

  # 3) second-brain backend
  - package-ecosystem: "npm"
    directory: "/apps/second-brain/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:20"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "dependabot"
      - "deps:backend"
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: "increase"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      backend-runtime:
        dependency-type: "production"
        patterns:
          - "*"
      backend-dev:
        dependency-type: "development"
        patterns:
          - "*"

  # 4) SDK packages
  - package-ecosystem: "npm"
    directories:
      - "/packages/agents"
      - "/packages/context"
      - "/packages/core"
      - "/packages/kit"
      - "/packages/memory"
      - "/packages/protocols"
      - "/packages/skills"
      - "/packages/tools"
      - "/packages/tools-builtin"
      - "/packages/utils"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dependabot"
      - "deps:packages"
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: "increase"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      packages-rollup:
        patterns:
          - "rollup"
          - "@rollup/*"
      packages-dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
      packages-runtime-deps:
        dependency-type: "production"
        patterns:
          - "*"
